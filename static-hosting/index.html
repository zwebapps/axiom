        var root = document.getElementById("root");

        root.innerHTML =
          '<div style="max-width:36rem;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;line-height:1.65;color:#e2e8f0;background:#0a1628;min-height:100vh">' +

          "<ol style=\"margin:1rem 0;padding-left:1.25rem\">" +
          "<li>Run <code style=\"background:#1e293b;padding:2px 6px;border-radius:4px\">npm run build:static</code></li>" +
          "<li>Test with <code style=\"background:#1e293b;padding:2px 6px;border-radius:4px\">npm run preview:static</code></li>" +
          "<li>Upload the whole <strong>static-html/</strong> folder (including <strong>assets/</strong>) to your host</li>" +
          "</ol>" +
          "<p style=\"font-size:0.875rem;color:#94a3b8\">Do not upload <strong>static-hosting/index.html</strong> — that is only a build template.</p>" +
          "</div>";
      })();
    </script>
